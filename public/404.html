<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brandon Khadan</title>
    <!-- GitHub Pages serves this file for any unknown path. It encodes the
         requested route into a query string and redirects to the app root, which
         restores the real URL (see the decode snippet in index.html).
         Root-domain site, so pathSegmentsToKeep = 0.
         See https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
